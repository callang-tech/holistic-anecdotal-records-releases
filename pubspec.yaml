name: holistic_anecdotal_records
description: HOLISTIC EDUCATIONAL ANECDOTAL RECORD & TRACKING SYSTEM
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  pdf: ^3.13.0
  printing: ^5.15.0
  google_sign_in_all_platforms: ^2.0.3
  googleapis: ^14.0.0
  http: ^1.5.0
  crypto: ^3.0.7
  cryptography: 2.9.0
  win32: 6.4.0
  ffi: 2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - pubspec.yaml
    - assets/google/google_oauth_client.example.json
    - assets/database/locations.db
    - assets/images/home_background.jpg
    - assets/images/SchoolHeader.PNG
    - assets/images/SchoolFooter.PNG
    - assets/images/about/app_logo.png
    - assets/images/about/school.jpg
    - assets/images/about/project_leader.jpg
